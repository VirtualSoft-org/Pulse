<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pulse Demo - Video Player</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="header-content">
                <h1>Pulse Demo</h1>
                <p>Video Streaming Platform</p>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Video Player -->
            <div class="video-section">
                <div class="video-player">
                    <img src="VirtualSoft.jpg" alt="video" class="video-frame"> <!-- Video Frame -->
                    <div class="play-button">▶</div>
                </div>
                <div class="video-info">
                    <h2>Live Stream Title</h2>
                    <p class="video-stats">23 online • started 45 min ago</p>
                </div>
            </div>

            <!-- Chat Box -->
            <div class="chat-section">
                <div class="chat-header">
                    <h3>Live Chat</h3>
                </div>
                <div class="chat-messages">
                    <div class="message">
                        <span class="username">User123</span>
                        <span class="text">Nice stream!</span>
                    </div>
                    <div class="message">
                        <span class="username">Dev_Pro</span>
                        <span class="text">Great demo here</span>
                    </div>
                    <div class="message">
                        <span class="username">TechFan</span>
                        <span class="text">Looking forward to this</span>
                    </div>
                </div>
                <div class="chat-input">
                    <input type="text" placeholder="Type a message..." class="input-field">
                    <button class="send-btn">Send</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
