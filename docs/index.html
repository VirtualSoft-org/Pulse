<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pulse</title>
<style>
  :root {
    --bg: #0b0d12; --panel: #12151c; --panel2: #191d27; --line: #262b36;
    --text: #e8eaf0; --dim: #8890a0; --accent: #6ea8ff; --accent2: #4d7fd6;
    --ok: #3ddc84; --warn: #f5c542; --bad: #ff5d5d;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }

  #splash { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 50; }
  #splash form { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 28px; width: 300px; max-width: calc(100vw - 32px); display: flex; flex-direction: column; gap: 12px; }
  #splash h1 { margin: 0 0 4px; font-size: 20px; display: flex; align-items: center; gap: 8px; }
  #splash h1 .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); }
  #splash p { margin: 0 0 8px; color: var(--dim); font-size: 13px; }
  #splash input { background: var(--panel2); border: 1px solid var(--line); color: var(--text); padding: 10px 12px; border-radius: 8px; font-size: 14px; }
  #splash button { background: var(--accent); border: none; color: #0b0d12; font-weight: 600; padding: 10px; border-radius: 8px; cursor: pointer; }
  #splash button:hover { background: var(--accent2); color: #fff; }
  #splashErr { color: var(--bad); font-size: 13px; min-height: 16px; }
  #splashProg { color: var(--dim); font-size: 12px; min-height: 16px; text-align: center; }
  #splash button:disabled { opacity: .75; cursor: wait; }
  #splash button .spin {
    display: inline-block; width: 12px; height: 12px; margin-right: 6px;
    border: 2px solid rgba(11,13,18,.35); border-top-color: #0b0d12;
    border-radius: 50%; animation: spin .8s linear infinite;
    vertical-align: -2px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #app { display: none; height: 100vh; flex-direction: column; }
  #app.show { display: flex; }
  #topbar { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
  #topbar b { font-size: 14px; }
  .pill { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--dim); padding: 4px 10px; border-radius: 20px; background: var(--panel2); }
  .pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--bad); }
  .pill.connected .dot { background: var(--ok); }
  .pill.reconnecting .dot { background: var(--warn); animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .3; } }

  #readyBtn { display: flex; align-items: center; gap: 6px; font-size: 12px; padding: 6px 12px; border-radius: 20px; background: var(--panel2); border: 1px solid var(--line); color: var(--dim); cursor: pointer; }
  #readyBtn.on { background: rgba(61,220,132,.15); border-color: var(--ok); color: var(--ok); }

  #members { display: flex; gap: 4px; margin-left: auto; flex-shrink: 0; }
  .avatar { position: relative; width: 26px; height: 26px; border-radius: 50%; background: var(--accent2); color: #fff; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center; }
  .avatar.ready::after { content: ''; position: absolute; bottom: -2px; right: -2px; width: 9px; height: 9px; border-radius: 50%; background: var(--ok); border: 2px solid var(--panel); }
  .avatar.host { box-shadow: 0 0 0 2px var(--warn); }

  .host-picker {
    position: absolute;
    top: calc(100% + 6px);
    right: 0;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 6px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    z-index: 200;
    min-width: 140px;
    box-shadow: 0 6px 20px rgba(0,0,0,.35);
  }
  .host-picker.hidden { display: none; }
  .host-pick {
    background: transparent;
    border: 0;
    color: var(--text);
    padding: 7px 10px;
    border-radius: 6px;
    text-align: left;
    cursor: pointer;
    font-size: 13px;
    font-family: inherit;
    white-space: nowrap;
  }
  .host-pick:hover { background: var(--panel2); }
  #dropzone { flex: 1; background: #000; border-radius: 10px; position: relative; min-height: 0; overflow: hidden; }
  /* On mobile the video's native aspect ratio is applied via JS after load.
     Until then, default to 16/9 to avoid layout jumps. */
  @media (max-width: 720px) { #dropzone { aspect-ratio: 16/9; max-height: 60vh; } }
  #layout { flex: 1; display: flex; min-height: 0; }
  #main { flex: 1; display: flex; flex-direction: column; padding: 14px; gap: 10px; min-width: 0; }

  video { width: 100%; height: 100%; border-radius: 10px; background: #000; object-fit: contain; }
  #hint { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 10px; color: var(--dim); font-size: 14px; pointer-events: none; }
  #hint button { pointer-events: auto; background: var(--panel2); border: 1px solid var(--line); color: var(--text); padding: 8px 14px; border-radius: 8px; cursor: pointer; }

  /* Custom player control bar */
  #dropzone { display: flex; flex-direction: column; }
  #dropzone video { flex: 1; min-height: 0; }
  #playerControls {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px;
    background: var(--panel);
    border-top: 1px solid var(--line);
    flex-shrink: 0;
  }
  .pc-btn {
    background: transparent; border: 0; color: var(--text);
    cursor: pointer; padding: 4px 6px; border-radius: 6px;
    font-size: 16px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    min-width: 32px; height: 32px; flex-shrink: 0;
  }
  .pc-btn:hover:not(:disabled) { background: var(--panel2); }
  .pc-btn:disabled { opacity: .35; cursor: not-allowed; }
  .pc-seek {
    flex: 1; min-width: 0; height: 4px; cursor: pointer;
    -webkit-appearance: none; appearance: none;
    background: var(--line); border-radius: 2px; outline: none;
    accent-color: var(--accent);
  }
  .pc-seek::-webkit-slider-thumb {
    -webkit-appearance: none; width: 12px; height: 12px;
    border-radius: 50%; background: var(--accent); cursor: pointer; border: 0;
  }
  .pc-seek::-moz-range-thumb {
    width: 12px; height: 12px; border-radius: 50%;
    background: var(--accent); cursor: pointer; border: 0;
  }
  .pc-seek:disabled { cursor: not-allowed; opacity: .35; }
  .pc-seek:disabled::-webkit-slider-thumb { background: var(--dim); }
  .pc-seek:disabled::-moz-range-thumb { background: var(--dim); }
  .pc-time {
    font-size: 12px; color: var(--dim);
    font-variant-numeric: tabular-nums;
    white-space: nowrap; flex-shrink: 0;
    min-width: 88px; text-align: center;
  }
  .pc-vol {
    width: 70px; height: 4px; cursor: pointer; flex-shrink: 0;
    -webkit-appearance: none; appearance: none;
    background: var(--line); border-radius: 2px; outline: none;
    accent-color: var(--accent);
  }
  .pc-vol::-webkit-slider-thumb {
    -webkit-appearance: none; width: 12px; height: 12px;
    border-radius: 50%; background: var(--accent); cursor: pointer; border: 0;
  }
  .pc-vol::-moz-range-thumb {
    width: 12px; height: 12px; border-radius: 50%;
    background: var(--accent); cursor: pointer; border: 0;
  }

  /* Non-host: block play + seek only */
  #dropzone.locked #pcPlay,
  #dropzone.locked #pcSeek { opacity: .35; pointer-events: none; }

  @media (max-width: 720px) {
    #playerControls { padding: 6px 8px; gap: 6px; }
    .pc-vol { width: 50px; }
    .pc-time { font-size: 11px; min-width: 74px; }
    .pc-btn { min-width: 28px; height: 28px; font-size: 14px; }
  }

  .bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .btn { background: var(--panel2); border: 1px solid var(--line); color: var(--text); padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; }
  .btn:hover { border-color: var(--accent); }
  .btn.busy { color: var(--warn); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn:disabled:hover { border-color: var(--line); }
  #toast { font-size: 12px; color: var(--dim); }

  #reactions { display: flex; gap: 4px; }
  #reactions button { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; font-size: 16px; cursor: pointer; line-height: 1; }
  #reactions button:hover { border-color: var(--accent); transform: scale(1.1); }

  .reaction-pop { position: absolute; font-size: 28px; pointer-events: none; animation: floatUp 1.6s ease-out forwards; }

  /* Fullscreen chat popups */
  .fs-msg-container {
    position: absolute;
    left: 50%;
    bottom: 96px;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    z-index: 1000;
    pointer-events: none;
    max-width: min(80%, 520px);
  }
  .fs-msg {
    pointer-events: auto;
    background: rgba(0,0,0,.78);
    color: #fff;
    padding: 9px 14px;
    border-radius: 20px;
    font-size: 14px;
    line-height: 1.35;
    max-width: 100%;
    opacity: 0;
    transform: translateY(12px);
    transition: opacity .22s ease, transform .22s ease;
    cursor: grab;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
    word-break: break-word;
    white-space: pre-wrap;
  }
  .fs-msg b { color: var(--accent); margin-right: 6px; font-weight: 600; }
  .fs-msg.show { opacity: 1; transform: translateY(0); }
  .fs-msg.hide { opacity: 0; transform: translateY(-8px); }
  .fs-msg:active { cursor: grabbing; }

  /* Fullscreen chat input (pull-down handle, top-right) */
  .fs-chat {
    position: absolute;
    top: 0;
    right: 16px;
    z-index: 1001;
    pointer-events: auto;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
  }
  .fs-chat-handle {
    width: 64px;
    height: 26px;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding-top: 7px;
    cursor: grab;
    touch-action: none;
    border-radius: 0 0 8px 8px;
    background: rgba(0,0,0,.55);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  .fs-chat-handle:active { cursor: grabbing; }
  .fs-chat-bar {
    width: 32px;
    height: 4px;
    border-radius: 2px;
    background: rgba(255,255,255,.75);
  }
  .fs-chat-input-wrap {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 4px;
    background: rgba(0,0,0,.78);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border-radius: 20px;
    padding: 6px 6px 6px 14px;
    width: 240px;
    max-width: calc(100vw - 32px);
    opacity: 0;
    transform: translateY(-8px);
    pointer-events: none;
    transition: opacity .2s ease, transform .2s ease;
  }
  .fs-chat.open .fs-chat-input-wrap {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }
  .fs-chat-input {
    flex: 1;
    background: transparent;
    border: 0;
    outline: 0;
    color: #fff;
    font-size: 14px;
    padding: 6px 0;
    min-width: 0;
    font-family: inherit;
  }
  .fs-chat-input::placeholder { color: rgba(255,255,255,.55); }
  .fs-chat-close {
    background: rgba(255,255,255,.15);
    border: 0;
    color: #fff;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .fs-chat-close:hover { background: rgba(255,255,255,.28); }

  @media (max-width: 720px) {
    .fs-chat { right: 8px; }
    .fs-chat-input-wrap { width: 200px; }
  }

  @media (max-width: 720px) {
    .fs-msg-container { bottom: 80px; max-width: 90%; }
    .fs-msg { font-size: 13px; padding: 8px 12px; }
  }
  @keyframes floatUp { 0% { opacity: 1; transform: translateY(0) scale(0.8); } 20% { transform: translateY(-10px) scale(1.1); } 100% { opacity: 0; transform: translateY(-90px) scale(1); } }

  #side { width: 280px; border-left: 1px solid var(--line); display: flex; flex-direction: column; background: var(--panel); }
  #chat { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
  .msg { max-width: 90%; padding: 6px 10px; border-radius: 10px; background: var(--panel2); font-size: 13px; line-height: 1.35; }
  .msg.me { align-self: flex-end; background: var(--accent2); color: #fff; }
  .msg .who { font-size: 10px; color: var(--dim); margin-bottom: 2px; }
  .msg.me .who { color: rgba(255,255,255,.7); }
  .sys { align-self: center; color: var(--dim); font-size: 11px; }
  #chatbar { display: flex; gap: 6px; padding: 10px; border-top: 1px solid var(--line); }
  #chatbar input { flex: 1; background: var(--panel2); border: 1px solid var(--line); color: var(--text); padding: 8px 10px; border-radius: 8px; }
  #chatbar button { background: var(--accent); border: none; color: #0b0d12; font-weight: 600; padding: 0 14px; border-radius: 8px; cursor: pointer; }

  @media (max-width: 720px) {
    body { height: 100dvh; overflow: hidden; }
    #app { height: 100dvh; }
    #topbar { padding: 8px 10px; gap: 8px; flex-wrap: wrap; }
    #topbar b { font-size: 13px; }
    .pill { font-size: 11px; padding: 3px 8px; }
    #readyBtn { font-size: 11px; padding: 5px 10px; }

    #layout { flex-direction: column; min-height: 0; }
    #main { padding: 8px; gap: 8px; }
    #dropzone { flex: 1; min-height: 0; }
    video { border-radius: 8px; }

    #side {
      width: 100%;
      height: 38vh;
      border-left: none;
      border-top: 1px solid var(--line);
      flex-shrink: 0;
    }
    #chat { padding: 8px; font-size: 12px; }
    .msg { max-width: 85%; font-size: 12px; padding: 5px 8px; }
    #chatbar { padding: 6px; }
    #chatbar input { font-size: 13px; padding: 8px 8px; }
    #chatbar button { padding: 0 10px; font-size: 13px; }

    .bar { gap: 6px; }
    .btn { padding: 7px 10px; font-size: 12px; }
    #reactions button { padding: 3px 6px; font-size: 14px; }
    #toast { font-size: 11px; width: 100%; }

    #members .avatar { width: 22px; height: 22px; font-size: 10px; }
  }

  @media (max-width: 420px) {
    #topbar { padding: 6px 8px; }
    .pill { font-size: 10px; padding: 2px 6px; }
    #readyBtn { font-size: 10px; padding: 4px 8px; }
    #side { height: 42vh; }
    .bar { flex-wrap: wrap; }
    .btn { flex: 1; min-width: 0; justify-content: center; }
    #reactions { width: 100%; justify-content: space-between; }
    #reactions button { flex: 1; text-align: center; }
  }
</style>

<div id="splash">
  <form id="joinForm">
    <h1><span class="dot"></span> Pulse</h1>
    <p>Watch your own local copy, together.</p>
    <input id="room" placeholder="room name" required>
    <input id="nick" placeholder="your name" required>
    <input id="pass" placeholder="passphrase (share with friends)">
    <button type="submit" id="joinBtn"><span>Join room</span></button>
    <div id="splashProg"></div>
    <div id="splashErr"></div>
  </form>
</div>

<div id="app">
  <div id="topbar">
    <b id="roomLabel"></b>
    <span class="pill" id="status"><span class="dot"></span><span id="statusText">connecting</span></span>
    <span class="pill" id="hostPill" style="position:relative">👑 <span id="hostText">…</span><div id="hostPicker" class="host-picker hidden"></div></span>
    <button id="readyBtn">○ Not ready</button>
    <div id="members"></div>
  </div>

  <div id="layout">
    <div id="main">
      <div id="dropzone">
        <video id="v" playsinline preload="metadata"></video>
        <div id="hint">
          <span>Drop your local video file here</span>
          <button id="pickFile">Choose file…</button>
        </div>
        <div id="playerControls">
          <button class="pc-btn" id="pcPlay" aria-label="Play">▶</button>
          <input class="pc-seek" id="pcSeek" type="range" min="0" max="1000" value="0" step="1" aria-label="Seek">
          <span class="pc-time" id="pcTime">0:00 / 0:00</span>
          <button class="pc-btn" id="pcMute" aria-label="Mute">🔊</button>
          <input class="pc-vol" id="pcVol" type="range" min="0" max="1" step="0.01" value="1" aria-label="Volume">
          <button class="pc-btn" id="pcFs" aria-label="Fullscreen">⛶</button>
        </div>
      </div>
      <div class="bar">
        <button class="btn" id="sync">🔄 One-time Sync</button>
        <button class="btn" id="restart">⏮ Restart from 0</button>
        <div id="reactions">
          <button data-e="👍">👍</button>
          <button data-e="😂">😂</button>
          <button data-e="😮">😮</button>
          <button data-e="❤️">❤️</button>
          <button data-e="😭">😭</button>
          <button data-e="🔥">🔥</button>
        </div>
        <span id="toast"></span>
      </div>
      <input id="file" type="file" accept="video/*" style="display:none">
    </div>

    <div id="side">
      <div id="chat"></div>
      <div id="chatbar">
        <input id="msg" placeholder="Message…">
        <button id="send">Send</button>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { connect, sendPlay, sendPause, sendSeek, sendChat, sendSyncReq, sendSyncRes, sendReaction, sendPosReq, sendPosRes, setReady, myId, transferHost } from './pulse.js'
import { hashFrame, findOffset } from './fingerprint.js'

const $ = id => document.getElementById(id)
const v = $('v'), chat = $('chat'), toast = $('toast'), dropzone = $('dropzone')

let offset = 0, applying = false, connected = false, fileKey = null
let iAmReady = false, snapped = false
let hostId = null, lastMembers = []
let roomPlaying = false

const remembered = {
  room: localStorage.getItem('pulse.room') || '',
  nick: localStorage.getItem('pulse.nick') || '',
  pass: localStorage.getItem('pulse.pass') || '',
}
$('room').value = remembered.room
$('nick').value = remembered.nick
$('pass').value = remembered.pass

function savePos() {
  if (!fileKey || !v.duration) return
  localStorage.setItem(fileKey, v.currentTime.toFixed(1))
}
setInterval(savePos, 4000)

function bubble(name, text, mine) {
  chat.insertAdjacentHTML('beforeend',
    `<div class="msg ${mine ? 'me' : ''}"><div class="who">${mine ? 'you' : name}</div>${text}</div>`)
  chat.scrollTop = 1e9
  showFsMessage(mine ? 'you' : name, text)
}

// Fullscreen chat popups ------------------------------------------------------
function fsElement() {
  return document.fullscreenElement || document.webkitFullscreenElement || null
}

function fsContainer() {
  const fs = fsElement()
  if (!fs) return null
  let c = fs.querySelector('.fs-msg-container')
  if (!c) {
    c = document.createElement('div')
    c.className = 'fs-msg-container'
    fs.appendChild(c)
  }
  return c
}

function showFsMessage(name, text) {
  const c = fsContainer()
  if (!c) return   // not fullscreen; nothing to do

  const el = document.createElement('div')
  el.className = 'fs-msg'
  const b = document.createElement('b')
  b.textContent = name || 'you'         // name is raw user input — safe
  const span = document.createElement('span')
  span.innerHTML = text                 // text is already HTML-escaped by caller
  el.appendChild(b)
  el.appendChild(span)
  c.appendChild(el)

  requestAnimationFrame(() => el.classList.add('show'))

  const dismiss = () => {
    el.classList.remove('show')
    el.classList.add('hide')
    setTimeout(() => el.remove(), 250)
  }

  let timer = setTimeout(dismiss, 3000)

  // Swipe / drag to dismiss (any direction, >40px)
  let sx = 0, sy = 0, dragging = false, pid = null
  el.addEventListener('pointerdown', e => {
    dragging = true; pid = e.pointerId; sx = e.clientX; sy = e.clientY
    try { el.setPointerCapture(pid) } catch {}
    clearTimeout(timer)
  })
  el.addEventListener('pointermove', e => {
    if (!dragging) return
    const dx = e.clientX - sx, dy = e.clientY - sy
    el.style.transform = `translate(${dx}px, ${dy}px)`
    el.style.opacity = String(Math.max(0, 1 - Math.hypot(dx, dy) / 120))
  })
  const end = e => {
    if (!dragging) return
    dragging = false
    const dx = e.clientX - sx, dy = e.clientY - sy
    if (Math.hypot(dx, dy) > 40) {
      dismiss()
    } else {
      el.style.transform = ''
      el.style.opacity = ''
      clearTimeout(timer)
      timer = setTimeout(dismiss, 1500)
    }
  }
  el.addEventListener('pointerup', end)
  el.addEventListener('pointercancel', () => {
    dragging = false
    el.style.transform = ''
    el.style.opacity = ''
  })
}

// Clean up when leaving fullscreen
function cleanupFsMessages() {
  if (fsElement()) return
  document.querySelectorAll('.fs-msg').forEach(el => el.remove())
  document.querySelectorAll('.fs-msg-container').forEach(el => el.remove())
  document.querySelectorAll('.fs-chat').forEach(el => el.remove())
}
document.addEventListener('fullscreenchange', cleanupFsMessages)
document.addEventListener('webkitfullscreenchange', cleanupFsMessages)

// Fullscreen chat input (pull-down handle) -----------------------------------
function ensureFsChat() {
  const fs = fsElement()
  if (!fs) return null
  let root = fs.querySelector('.fs-chat')
  if (root) return root

  root = document.createElement('div')
  root.className = 'fs-chat'
  root.innerHTML = `
    <div class="fs-chat-handle" role="button" aria-label="Open chat">
      <div class="fs-chat-bar"></div>
    </div>
    <div class="fs-chat-input-wrap">
      <input class="fs-chat-input" type="text" placeholder="Message…" autocomplete="off" enterkeyhint="send" />
      <button class="fs-chat-close" aria-label="Close" type="button">×</button>
    </div>
  `
  fs.appendChild(root)

  const handle   = root.querySelector('.fs-chat-handle')
  const input    = root.querySelector('.fs-chat-input')
  const closeBtn = root.querySelector('.fs-chat-close')

  const open = () => {
    root.classList.add('open')
    // Must fire inside the gesture to open the mobile keyboard.
    setTimeout(() => input.focus(), 60)
  }
  const close = () => {
    root.classList.remove('open')
    input.blur()
  }
  const toggle = () => root.classList.contains('open') ? close() : open()

  let sy = 0, dragging = false
  handle.addEventListener('pointerdown', e => {
    dragging = true
    sy = e.clientY
    try { handle.setPointerCapture(e.pointerId) } catch {}
  })
  handle.addEventListener('pointermove', e => {
    if (!dragging) return
    const dy = e.clientY - sy
    if (dy >  20 && !root.classList.contains('open')) { open();  dragging = false }
    if (dy < -20 &&  root.classList.contains('open')) { close(); dragging = false }
  })
  const endDrag = e => {
    if (!dragging) return
    dragging = false
    const dy = e.clientY - sy
    if (dy >  8) open()
    else if (dy < -8) close()
    else toggle()          // treated as a tap
  }
  handle.addEventListener('pointerup', endDrag)
  handle.addEventListener('pointercancel', () => { dragging = false })

  closeBtn.addEventListener('click', close)

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      e.preventDefault()
      const text = input.value.trim()
      if (!text) return
      sendChat(text)
      bubble('', escapeHtml(text), true)
      input.value = ''
      close()
    } else if (e.key === 'Escape') {
      e.preventDefault()
      close()
    }
  })
  return root
}

// Entering fullscreen → attach the handle. Leaving → cleanup runs above.
document.addEventListener('fullscreenchange', () => { ensureFsChat() })
document.addEventListener('webkitfullscreenchange', () => { ensureFsChat() })

// Global "tap outside to close" — registered once, not per fullscreen session.
document.addEventListener('pointerdown', e => {
  const openChat = document.querySelector('.fs-chat.open')
  if (!openChat) return
  if (openChat.contains(e.target)) return
  openChat.classList.remove('open')
  const inp = openChat.querySelector('.fs-chat-input')
  if (inp) inp.blur()
}, true)

// Auto fullscreen on landscape rotation (mobile only) -------------------------
function isMobileDevice() {
  return matchMedia('(hover: none) and (pointer: coarse)').matches
}

function isLandscape() {
  if (screen.orientation && screen.orientation.type) {
    return screen.orientation.type.startsWith('landscape')
  }
  return window.innerWidth > window.innerHeight
}

async function handleOrientationChange() {
  if (!isMobileDevice()) return
  if (!$('app').classList.contains('show')) return
  if (!v.src) return
  if (!dropzone.requestFullscreen) return
  try {
    if (isLandscape() && !document.fullscreenElement) {
      await dropzone.requestFullscreen()
    } else if (!isLandscape() && document.fullscreenElement) {
      await document.exitFullscreen()
    }
  } catch (e) {
    console.debug('[pulse] auto-fullscreen blocked:', e && e.message)
  }
}

if (screen.orientation && screen.orientation.addEventListener) {
  screen.orientation.addEventListener('change', handleOrientationChange)
} else {
  window.addEventListener('orientationchange', () => {
    setTimeout(handleOrientationChange, 200)   // give browser time to update dims
  })
}
function sys(text) {
  chat.insertAdjacentHTML('beforeend', `<div class="sys">${text}</div>`)
  chat.scrollTop = 1e9
}
function say(text, ms = 4000) {
  toast.textContent = text
  clearTimeout(say._t)
  say._t = setTimeout(() => { if (toast.textContent === text) toast.textContent = '' }, ms)
}
function renderMembers(members) {
  if (members) lastMembers = members
  $('members').innerHTML = lastMembers.map(m => {
    const isHost = m.user_id && m.user_id === hostId
    return `<div class="avatar ${m.ready ? 'ready' : ''} ${isHost ? 'host' : ''}" title="${m.name}${m.ready ? ' (ready)' : ''}${isHost ? ' · host' : ''}">${m.name.slice(0, 2).toUpperCase()}</div>`
  }).join('')
}

function setHost(id) {
  const prev = hostId
  hostId = id
  const my = myId()
  const mine = !!id && id === my
  const m = lastMembers.find(x => x.user_id === id)
  $('hostText').textContent = mine ? 'you ▾' : (m ? m.name : '—')
  const pill = $('hostPill')
  if (pill) {
    pill.style.cursor = mine ? 'pointer' : 'default'
    pill.title = mine ? 'Click to transfer host' : 'Host'
  }
  // Close any open picker if we're no longer host.
  if (!mine) {
    const picker = $('hostPicker')
    if (picker) picker.classList.add('hidden')
  }
  applyHostLock()
  renderMembers()
  console.log('[pulse] host set:', id, '| me:', my, '| mine:', mine)
  if (connected && id !== prev) {
    if (mine) say('You are host 👑')
    else if (id) say(`${m ? m.name : 'Someone'} is host`)
  }
}

function applyHostLock() {
  const mine = !hostId || hostId === myId()
  dropzone.classList.toggle('locked', !mine)
  $('sync').disabled = !mine
  $('restart').disabled = !mine
  const p = $('pcPlay'), s = $('pcSeek')
  if (p) p.disabled = !mine
  if (s) s.disabled = !mine
}

function openHostPicker() {
  const picker = $('hostPicker')
  const others = lastMembers.filter(m => m.user_id && m.user_id !== myId())
  if (!others.length) { say('No one else in the room'); return }
  picker.innerHTML = others.map(m =>
    `<button class="host-pick" data-id="${m.user_id}">${escapeHtml(m.name)}</button>`
  ).join('')
  picker.classList.remove('hidden')
  picker.querySelectorAll('.host-pick').forEach(btn => {
    btn.onclick = ev => {
      ev.stopPropagation()
      transferHost(btn.dataset.id)
      say(`Host transferred to ${btn.textContent}`)
      picker.classList.add('hidden')
    }
  })
}

$('hostPill').onclick = e => {
  e.stopPropagation()
  if (!connected) return
  if (hostId !== myId()) return
  const picker = $('hostPicker')
  if (picker.classList.contains('hidden')) openHostPicker()
  else picker.classList.add('hidden')
}

document.addEventListener('click', e => {
  const picker = $('hostPicker')
  if (!picker || picker.classList.contains('hidden')) return
  if (picker.contains(e.target)) return
  if (e.target.closest('#hostPill')) return
  picker.classList.add('hidden')
})

function setStatus(state) {
  const pill = $('status')
  pill.className = 'pill ' + state
  $('statusText').textContent = { connected: 'live', reconnecting: 'reconnecting…', lost: 'lost — reload page' }[state] || state
}

function loadFile(f) {
  if (!f) return
  v.src = URL.createObjectURL(f)
  fileKey = `pulse.pos.${f.name}.${f.size}`
  v.onloadedmetadata = () => {
    const saved = parseFloat(localStorage.getItem(fileKey))
    if (saved > 5) { v.currentTime = saved; say(`Resumed at ${fmt(saved)}`) }
    if (v.videoWidth && v.videoHeight) {
      dropzone.style.aspectRatio = `${v.videoWidth} / ${v.videoHeight}`
    }
    v.onloadedmetadata = null
    if (connected) { snapped = false; sendPosReq() }
    handleOrientationChange()
  }
  $('hint').style.display = 'none'
}
function fmt(s) { return new Date(s * 1000).toISOString().substr(11, 8) }

$('pickFile').onclick = () => $('file').click()
$('file').onchange = e => loadFile(e.target.files[0])
;['dragover', 'drop'].forEach(ev => dropzone.addEventListener(ev, e => e.preventDefault()))
dropzone.addEventListener('drop', e => loadFile(e.dataTransfer.files[0]))

function friendlyConnectError(err) {
  const m = String((err && err.message) || err || '')
  if (/CHANNEL_ERROR|TIMED_OUT|CLOSED|subscribe timeout/i.test(m))
    return 'Could not reach the room server. Check your connection and try again.'
  if (/^auth:/i.test(m))
    return 'Sign-in failed. Try again.'
  return m || 'Could not connect.'
}

$('joinForm').onsubmit = async e => {
  e.preventDefault()
  const btn = $('joinBtn')
  if (btn.disabled) return

  const room = $('room').value.trim(), nick = $('nick').value.trim(), pass = $('pass').value.trim()
  localStorage.setItem('pulse.room', room)
  localStorage.setItem('pulse.nick', nick)
  localStorage.setItem('pulse.pass', pass)

  $('splashErr').textContent = ''
  $('splashProg').textContent = ''
  btn.disabled = true
  btn.innerHTML = '<span class="spin"></span>Joining…'

  try {
    await connect(room, nick, pass, {
      onEvent,
      onMembers: renderMembers,
      onHost: setHost,
      onStatus: setStatus,
      onProgress: msg => { $('splashProg').textContent = msg },
    })
    connected = true
    $('roomLabel').textContent = room
    document.getElementById('splash').style.display = 'none'
    document.getElementById('app').classList.add('show')
    snapped = false
    applyHostLock()
    sendPosReq()   // late-join snap
  } catch (err) {
    $('splashErr').textContent = friendlyConnectError(err)
    $('splashProg').textContent = ''
    btn.disabled = false
    btn.innerHTML = '<span>Try again</span>'
  }
}

$('readyBtn').onclick = () => {
  iAmReady = !iAmReady
  $('readyBtn').classList.toggle('on', iAmReady)
  $('readyBtn').textContent = iAmReady ? '● Ready' : '○ Not ready'
  setReady(iAmReady)
}

function onEvent(e) {
  if (e.t === 'chat') return bubble(e.name, escapeHtml(e.text), false)

  if (e.t === 'play') {
    const lag = Math.min(2, Math.max(0, (Date.now() - e.sentAt) / 1000))
    const target = e.at + offset + lag
    roomPlaying = true
    applying = true
    if (Math.abs(v.currentTime - target) > 0.3) v.currentTime = target
    v.play().catch(() => {}).finally(() => setTimeout(() => applying = false, 250))
    sys(`${e.name} pressed play`)
  }
  if (e.t === 'pause') {
    roomPlaying = false
    applying = true
    v.pause()
    const target = e.at + offset
    if (Math.abs(v.currentTime - target) > 0.3) v.currentTime = target
    setTimeout(() => applying = false, 250)
    sys(`${e.name} paused`)
  }
  if (e.t === 'seek') {
    const target = e.at + offset
    applying = true
    if (Math.abs(v.currentTime - target) > 0.3) v.currentTime = target
    setTimeout(() => applying = false, 250)
    sys(`${e.name} seeked to ${fmt(target)}`)
  }
  if (e.t === 'sync_req') runSync(e)
  if (e.t === 'sync_res') sys(e.ok ? `${e.name} synced (${e.offset.toFixed(2)}s offset)` : `${e.name} couldn't find a match`)
  if (e.t === 'reaction') spawnReaction(e.emoji, e.name)

  // late-join snap protocol
  if (e.t === 'pos_req') {
    if (v.duration) sendPosRes(e.from, v.currentTime - offset, !v.paused)
  }
  if (e.t === 'pos_res') {
    if (snapped || !v.duration) return
    snapped = true
    roomPlaying = !!e.playing
    const lag = e.playing ? Math.min(2, Math.max(0, (Date.now() - e.sentAt) / 1000)) : 0
    const target = e.at + offset + lag
    v.currentTime = target
    if (e.playing) {
      applying = true
      v.play().catch(() => {}).finally(() => setTimeout(() => applying = false, 250))
    } else {
      applying = true
      v.pause()
      setTimeout(() => applying = false, 250)
    }
    say(`Jumped to ${e.name}'s position`)
  }
}

async function runSync(e) {
  const btn = $('sync')
  btn.classList.add('busy'); btn.textContent = '🔄 Syncing…'
  const r = await findOffset(v, e.hash)
  if (r.ok) { offset = r.localTime - e.at; say(`Synced — offset ${offset.toFixed(2)}s`) }
  else say('No matching scene found nearby')
  btn.classList.remove('busy'); btn.textContent = '🔄 One-time Sync'
  sendSyncRes(e.from, r.ok, offset)
}

function spawnReaction(emoji, name) {
  const el = document.createElement('div')
  el.className = 'reaction-pop'
  el.textContent = emoji
  el.style.left = (20 + Math.random() * 60) + '%'
  el.style.bottom = '10%'
  dropzone.appendChild(el)
  setTimeout(() => el.remove(), 1700)
  sys(`${name} reacted ${emoji}`)
}

document.querySelectorAll('#reactions button').forEach(btn => {
  btn.onclick = () => {
    if (!connected) return
    const emoji = btn.dataset.e
    sendReaction(emoji)
    spawnReaction(emoji, 'you')
  }
})

function enforceRoomState() {
  if (!hostId || hostId === myId()) return
  const attempt = () => {
    applying = true
    if (roomPlaying && v.paused) v.play().catch(() => {})
    else if (!roomPlaying && !v.paused) v.pause()
    setTimeout(() => { applying = false }, 250)
  }
  attempt()
  setTimeout(attempt, 400)   // second chance in case the first was ignored
}

v.addEventListener('play', () => {
  updatePcPlay()
  if (applying) return
  if (hostId && hostId !== myId()) { enforceRoomState(); return }
  if (connected) sendPlay(v.currentTime - offset)
})
v.addEventListener('pause', () => {
  updatePcPlay()
  if (applying) return
  if (hostId && hostId !== myId()) { enforceRoomState(); return }
  if (connected) sendPause(v.currentTime - offset)
})

// Custom player controls -----------------------------------------------------
function fmtTime(s) {
  if (!isFinite(s) || s < 0) s = 0
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = Math.floor(s % 60)
  return h > 0
    ? `${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`
    : `${m}:${String(sec).padStart(2,'0')}`
}

function updatePcPlay() {
  const b = $('pcPlay'); if (!b) return
  b.textContent = v.paused ? '▶' : '⏸'
  b.setAttribute('aria-label', v.paused ? 'Play' : 'Pause')
}

function updatePcTime() {
  const el = $('pcTime'); if (!el) return
  el.textContent = `${fmtTime(v.currentTime)} / ${fmtTime(v.duration)}`
}

function updatePcSeek() {
  const s = $('pcSeek'); if (!s || s.matches(':active')) return
  const d = v.duration || 0
  s.value = d ? String(Math.round((v.currentTime / d) * 1000)) : '0'
}

function updatePcMute() {
  const b = $('pcMute'); if (!b) return
  const muted = v.muted || v.volume === 0
  b.textContent = muted ? '🔇' : '🔊'
  b.setAttribute('aria-label', muted ? 'Unmute' : 'Mute')
}

$('pcPlay').onclick = () => {
  if (hostId && hostId !== myId()) return
  if (v.paused) v.play().catch(() => {})
  else v.pause()
}
$('pcMute').onclick = () => {
  v.muted = !v.muted
  if (!v.muted && v.volume === 0) v.volume = 1
  $('pcVol').value = String(v.muted ? 0 : v.volume)
  updatePcMute()
}
$('pcVol').oninput = e => {
  const val = parseFloat(e.target.value)
  v.volume = val
  v.muted = val === 0
  updatePcMute()
}
$('pcSeek').oninput = e => {
  if (hostId && hostId !== myId()) return
  const d = v.duration || 0
  if (!d) return
  v.currentTime = (parseFloat(e.target.value) / 1000) * d
}
// Fires when the user releases the slider (mouse up / touch end / keyboard change).
// oninput alone would spam the room with seek events on every pixel drag.
$('pcSeek').onchange = () => {
  if (!connected) return
  if (hostId && hostId !== myId()) return
  sendSeek(v.currentTime - offset)
}
$('pcFs').onclick = async () => {
  try {
    if (!document.fullscreenElement) await dropzone.requestFullscreen()
    else await document.exitFullscreen()
  } catch (err) {
    console.debug('[pulse] fullscreen failed:', err && err.message)
  }
}

v.addEventListener('timeupdate', () => { updatePcSeek(); updatePcTime() })
v.addEventListener('loadedmetadata', () => { updatePcTime(); updatePcSeek() })
v.addEventListener('volumechange', updatePcMute)
document.addEventListener('fullscreenchange', () => {
  const b = $('pcFs'); if (b) b.textContent = document.fullscreenElement ? '⤡' : '⛶'
})

// Keyboard: space = play/pause, F = fullscreen (host only)
window.addEventListener('keydown', e => {
  if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return
  if (e.key === ' ' && !e.repeat) {
    e.preventDefault()
    $('pcPlay').click()
  } else if (e.key === 'f' || e.key === 'F') {
    e.preventDefault()
    $('pcFs').click()
  }
})

updatePcPlay(); updatePcMute(); updatePcTime()

$('sync').onclick = () => {
  if (hostId && hostId !== myId()) return say('Only the host can sync')
  const h = hashFrame(v)
  if (!h) return say('Load a video first')
  sendSyncReq(h, v.currentTime - offset)
  say('Sync request sent')
}
$('restart').onclick = () => {
  if (hostId && hostId !== myId()) return say('Only the host can restart')
  v.currentTime = 0; if (fileKey) localStorage.removeItem(fileKey)
}

function post() {
  const box = $('msg'), text = box.value.trim()
  if (!connected || !text) return
  sendChat(text); bubble('', escapeHtml(text), true); box.value = ''
}
$('send').onclick = post
$('msg').onkeydown = e => { if (e.key === 'Enter') post() }
function escapeHtml(s) { return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])) }
