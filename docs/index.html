<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pulse</title>
<style>
  :root {
    --bg: #0b0d12; --panel: #12151c; --panel2: #191d27; --line: #262b36;
    --text: #e8eaf0; --dim: #8890a0; --accent: #6ea8ff; --accent2: #4d7fd6;
    --ok: #3ddc84; --warn: #f5c542; --bad: #ff5d5d;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }

  #splash { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 50; }
  #splash form { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 28px; width: 300px; max-width: calc(100vw - 32px); display: flex; flex-direction: column; gap: 12px; }
  #splash h1 { margin: 0 0 4px; font-size: 20px; display: flex; align-items: center; gap: 8px; }
  #splash h1 .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); }
  #splash p { margin: 0 0 8px; color: var(--dim); font-size: 13px; }
  #splash input { background: var(--panel2); border: 1px solid var(--line); color: var(--text); padding: 10px 12px; border-radius: 8px; font-size: 14px; }
  #splash button { background: var(--accent); border: none; color: #0b0d12; font-weight: 600; padding: 10px; border-radius: 8px; cursor: pointer; }
  #splash button:hover { background: var(--accent2); color: #fff; }
  #splashErr { color: var(--bad); font-size: 13px; min-height: 16px; }
  #splashProg { color: var(--dim); font-size: 12px; min-height: 16px; text-align: center; }
  #splash button:disabled { opacity: .75; cursor: wait; }
  #splash button .spin {
    display: inline-block; width: 12px; height: 12px; margin-right: 6px;
    border: 2px solid rgba(11,13,18,.35); border-top-color: #0b0d12;
    border-radius: 50%; animation: spin .8s linear infinite;
    vertical-align: -2px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #app { display: none; height: 100vh; flex-direction: column; }
  #app.show { display: flex; }
  #topbar { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
  #topbar b { font-size: 14px; }
  .pill { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--dim); padding: 4px 10px; border-radius: 20px; background: var(--panel2); }
  .pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--bad); }
  .pill.connected .dot { background: var(--ok); }
  .pill.reconnecting .dot { background: var(--warn); animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .3; } }

  #readyBtn { display: flex; align-items: center; gap: 6px; font-size: 12px; padding: 6px 12px; border-radius: 20px; background: var(--panel2); border: 1px solid var(--line); color: var(--dim); cursor: pointer; }
  #readyBtn.on { background: rgba(61,220,132,.15); border-color: var(--ok); color: var(--ok); }

  #members { display: flex; gap: 4px; margin-left: auto; flex-shrink: 0; }
  .avatar { position: relative; width: 26px; height: 26px; border-radius: 50%; background: var(--accent2); color: #fff; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center; }
  .avatar.ready::after { content: ''; position: absolute; bottom: -2px; right: -2px; width: 9px; height: 9px; border-radius: 50%; background: var(--ok); border: 2px solid var(--panel); }
  .avatar.host { box-shadow: 0 0 0 2px var(--warn); }
  .avatar img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover; border-radius: 50%;
    display: block;
  }

  .host-picker {
    position: absolute;
    top: calc(100% + 6px);
    right: 0;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 6px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    z-index: 200;
    min-width: 140px;
    box-shadow: 0 6px 20px rgba(0,0,0,.35);
  }
  .host-picker.hidden { display: none; }
  .host-pick {
    background: transparent;
    border: 0;
    color: var(--text);
    padding: 7px 10px;
    border-radius: 6px;
    text-align: left;
    cursor: pointer;
    font-size: 13px;
    font-family: inherit;
    white-space: nowrap;
  }
  .host-pick:hover { background: var(--panel2); }
  #dropzone {
    flex: 1;
    min-height: 0;
    min-width: 0;
    background: #000;
    border-radius: 10px;
    position: relative;
    overflow: hidden;
  }
  /* Mobile: fixed 16:9 box, capped so it can't push the layout around.
     Vertical and ultra-wide videos letterbox inside via object-fit: contain. */
  @media (max-width: 720px) {
    #dropzone { aspect-ratio: 16 / 9; max-height: 50vh; }
  }
  #layout { flex: 1; display: flex; min-height: 0; }
  #main { flex: 1; display: flex; flex-direction: column; padding: 14px; gap: 10px; min-width: 0; min-height: 0; position: relative; }

  .btn.on { border-color: var(--ok); color: var(--ok); background: rgba(61,220,132,.12); }

  .sub-panel {
    position: absolute;
    left: 14px;
    bottom: 64px;
    z-index: 300;
    width: 280px;
    max-width: calc(100vw - 28px);
    max-height: 70vh;
    overflow-y: auto;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    box-shadow: 0 10px 32px rgba(0,0,0,.45);
    font-size: 13px;
  }
  .sub-panel.hidden { display: none; }
  .sub-panel-head {
    display: flex; align-items: center; justify-content: space-between;
    font-weight: 600; font-size: 13px; color: var(--text);
  }
  .sub-x {
    background: transparent; border: 0; color: var(--dim);
    font-size: 18px; line-height: 1; cursor: pointer; padding: 0 4px;
  }
  .sub-x:hover { color: var(--text); }
  .sub-load {
    background: var(--panel2); border: 1px dashed var(--line);
    color: var(--text); padding: 9px 10px; border-radius: 8px;
    cursor: pointer; font-size: 12px; font-family: inherit; text-align: left;
  }
  .sub-load:hover { border-color: var(--accent); }
  .sub-note {
    font-size: 11px; color: var(--warn);
    background: rgba(245,197,66,.08);
    border: 1px solid rgba(245,197,66,.25);
    border-radius: 8px; padding: 7px 9px; line-height: 1.35;
  }
  .sub-note.hidden { display: none; }
  .sub-row {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--dim);
  }
  .sub-row input[type="range"] {
    grid-column: 1 / -1;
    width: 100%;
    -webkit-appearance: none; appearance: none;
    height: 4px; border-radius: 2px;
    background: var(--line); outline: none;
    accent-color: var(--accent);
  }
  .sub-row input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 12px; height: 12px;
    border-radius: 50%; background: var(--accent); border: 0; cursor: pointer;
  }
  .sub-row input[type="range"]::-moz-range-thumb {
    width: 12px; height: 12px; border-radius: 50%;
    background: var(--accent); border: 0; cursor: pointer;
  }
  .sub-row input[type="color"] {
    width: 34px; height: 24px; padding: 0;
    border: 1px solid var(--line); border-radius: 6px;
    background: transparent; cursor: pointer;
  }
  .sub-row select {
    background: var(--panel2); border: 1px solid var(--line);
    color: var(--text); border-radius: 6px; padding: 4px 8px;
    font-size: 12px; font-family: inherit;
  }
  .sub-row.sub-check {
    display: flex; align-items: center; gap: 8px;
    grid-template-columns: none;
  }
  .sub-val { font-variant-numeric: tabular-nums; color: var(--text); font-size: 12px; }
  .sub-sep { height: 1px; background: var(--line); margin: 2px 0; }
  .sub-actions { display: flex; gap: 8px; }
  .sub-actions .btn { flex: 1; text-align: center; font-size: 12px; padding: 7px 8px; }

  @media (max-width: 720px) {
    .sub-panel { left: 8px; right: 8px; width: auto; max-width: none; bottom: 56px; }
  }

  .video-wrap {
    flex: 1;
    min-height: 0;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  video {
    /* Intrinsic sizing: the element box matches the rendered picture, so
       ASS.js and native ::cue tracks both align without letterbox math. */
    width: auto;
    height: auto;
    max-width: 100%;
    max-height: 100%;
    display: block;
    border-radius: 10px;
    background: #000;
    object-fit: contain;
  }
  .ass-container {
    position: absolute;
    pointer-events: none;
    overflow: hidden;
    z-index: 5;
  }
  #hint { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 10px; color: var(--dim); font-size: 14px; pointer-events: none; }
  #hint button { pointer-events: auto; background: var(--panel2); border: 1px solid var(--line); color: var(--text); padding: 8px 14px; border-radius: 8px; cursor: pointer; }

  /* Custom player control bar */
  #dropzone { display: flex; flex-direction: column; }
  #playerControls {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px;
    background: var(--panel);
    border-top: 1px solid var(--line);
    flex-shrink: 0;
    transition: opacity .25s ease, transform .25s ease;
  }
  #dropzone.pc-hidden #playerControls {
    opacity: 0;
    pointer-events: none;
    transform: translateY(6px);
  }
  #dropzone.pc-hidden { cursor: none; }
  .pc-btn {
    background: transparent; border: 0; color: var(--text);
    cursor: pointer; padding: 4px 6px; border-radius: 6px;
    font-size: 16px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    min-width: 32px; height: 32px; flex-shrink: 0;
  }
  .pc-btn:hover:not(:disabled) { background: var(--panel2); }
  .pc-btn:disabled { opacity: .35; cursor: not-allowed; }
  .pc-seek {
    flex: 1; min-width: 0; height: 4px; cursor: pointer;
    -webkit-appearance: none; appearance: none;
    background: var(--line); border-radius: 2px; outline: none;
    accent-color: var(--accent);
  }
  .pc-seek::-webkit-slider-thumb {
    -webkit-appearance: none; width: 12px; height: 12px;
    border-radius: 50%; background: var(--accent); cursor: pointer; border: 0;
  }
  .pc-seek::-moz-range-thumb {
    width: 12px; height: 12px; border-radius: 50%;
    background: var(--accent); cursor: pointer; border: 0;
  }
  .pc-seek:disabled { cursor: not-allowed; opacity: .35; }
  .pc-seek:disabled::-webkit-slider-thumb { background: var(--dim); }
  .pc-seek:disabled::-moz-range-thumb { background: var(--dim); }
  .pc-time {
    font-size: 12px; color: var(--dim);
    font-variant-numeric: tabular-nums;
    white-space: nowrap; flex-shrink: 0;
    min-width: 88px; text-align: center;
  }
  .pc-vol {
    width: 70px; height: 4px; cursor: pointer; flex-shrink: 0;
    -webkit-appearance: none; appearance: none;
    background: var(--line); border-radius: 2px; outline: none;
    accent-color: var(--accent);
  }
  .pc-vol::-webkit-slider-thumb {
    -webkit-appearance: none; width: 12px; height: 12px;
    border-radius: 50%; background: var(--accent); cursor: pointer; border: 0;
  }
  .pc-vol::-moz-range-thumb {
    width: 12px; height: 12px; border-radius: 50%;
    background: var(--accent); cursor: pointer; border: 0;
  }

  /* Non-host: block play + seek only */
  #dropzone.locked #pcPlay,
  #dropzone.locked #pcSeek { opacity: .35; pointer-events: none; }

  @media (max-width: 720px) {
    #playerControls { padding: 6px 8px; gap: 6px; }
    .pc-vol { width: 50px; }
    .pc-time { font-size: 11px; min-width: 74px; }
    .pc-btn { min-width: 28px; height: 28px; font-size: 14px; }
  }

  .bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .btn { background: var(--panel2); border: 1px solid var(--line); color: var(--text); padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; }
  .btn:hover { border-color: var(--accent); }
  .btn.busy { color: var(--warn); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn:disabled:hover { border-color: var(--line); }
  #toast { font-size: 12px; color: var(--dim); }

  #reactions { display: flex; gap: 4px; }
  #reactions button { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; font-size: 16px; cursor: pointer; line-height: 1; }
  #reactions button:hover { border-color: var(--accent); transform: scale(1.1); }

  .reaction-pop { position: absolute; font-size: 28px; pointer-events: none; animation: floatUp 1.6s ease-out forwards; }

  /* Fullscreen chat popups */
  .fs-msg-container {
    position: absolute;
    left: 50%;
    bottom: 96px;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    z-index: 1000;
    pointer-events: none;
    max-width: min(80%, 520px);
  }
  .fs-msg {
    pointer-events: auto;
    background: rgba(0,0,0,.78);
    color: #fff;
    padding: 9px 14px;
    border-radius: 20px;
    font-size: 14px;
    line-height: 1.35;
    max-width: 100%;
    opacity: 0;
    transform: translateY(12px);
    transition: opacity .22s ease, transform .22s ease;
    cursor: grab;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
    word-break: break-word;
    white-space: pre-wrap;
  }
  .fs-msg b { color: var(--accent); margin-right: 6px; font-weight: 600; }
  .fs-msg.show { opacity: 1; transform: translateY(0); }
  .fs-msg.hide { opacity: 0; transform: translateY(-8px); }
  .fs-msg:active { cursor: grabbing; }

  /* Fullscreen chat input (pull-down handle, top-right) */
  .fs-chat {
    position: absolute;
    top: 0;
    right: 16px;
    z-index: 1001;
    pointer-events: auto;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
  }
  .fs-chat-handle {
    width: 64px;
    height: 26px;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding-top: 7px;
    cursor: grab;
    touch-action: none;
    border-radius: 0 0 8px 8px;
    background: rgba(0,0,0,.55);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  .fs-chat-handle:active { cursor: grabbing; }
  .fs-chat-bar {
    width: 32px;
    height: 4px;
    border-radius: 2px;
    background: rgba(255,255,255,.75);
  }
  .fs-chat-input-wrap {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 4px;
    background: rgba(0,0,0,.78);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border-radius: 20px;
    padding: 6px 6px 6px 14px;
    width: 240px;
    max-width: calc(100vw - 32px);
    opacity: 0;
    transform: translateY(-8px);
    pointer-events: none;
    transition: opacity .2s ease, transform .2s ease;
  }
  .fs-chat.open .fs-chat-input-wrap {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }
  .fs-chat-input {
    flex: 1;
    background: transparent;
    border: 0;
    outline: 0;
    color: #fff;
    font-size: 14px;
    padding: 6px 0;
    min-width: 0;
    font-family: inherit;
  }
  .fs-chat-input::placeholder { color: rgba(255,255,255,.55); }
  .fs-chat-close {
    background: rgba(255,255,255,.15);
    border: 0;
    color: #fff;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .fs-chat-close:hover { background: rgba(255,255,255,.28); }

  /* Fullscreen reactions (pull-down handle, top-left) */
  .fs-react {
    position: absolute;
    top: 0;
    left: 16px;
    z-index: 1001;
    pointer-events: auto;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }
  .fs-react-handle {
    width: 64px;
    height: 26px;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding-top: 7px;
    cursor: grab;
    touch-action: none;
    border-radius: 0 0 8px 8px;
    background: rgba(0,0,0,.55);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  .fs-react-handle:active { cursor: grabbing; }
  .fs-react-bar {
    width: 32px;
    height: 4px;
    border-radius: 2px;
    background: rgba(255,255,255,.75);
  }
  .fs-react-row {
    display: flex;
    gap: 4px;
    margin-top: 4px;
    background: rgba(0,0,0,.78);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border-radius: 20px;
    padding: 6px;
    opacity: 0;
    transform: translateY(-8px);
    pointer-events: none;
    transition: opacity .2s ease, transform .2s ease;
  }
  .fs-react.open .fs-react-row {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }
  .fs-react-row button {
    background: rgba(255,255,255,.12);
    border: 0;
    border-radius: 10px;
    padding: 4px 8px;
    font-size: 18px;
    cursor: pointer;
    line-height: 1;
    transition: transform .12s ease, background .12s ease;
  }
  .fs-react-row button:hover { background: rgba(255,255,255,.25); transform: scale(1.08); }

  @media (max-width: 720px) {
    .fs-react { left: 8px; }
    .fs-react-row button { font-size: 16px; padding: 3px 6px; }
  }

  /* Brightness / volume gesture indicator (fullscreen) */
  .fs-indicator {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,.72);
    color: #fff;
    padding: 16px 24px;
    border-radius: 14px;
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    pointer-events: none;
    z-index: 1002;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    min-width: 130px;
    text-align: center;
  }
  .fs-indicator.show { display: flex; }
  .fs-indicator-icon { font-size: 26px; line-height: 1; }
  .fs-indicator-bar {
    width: 100%;
    height: 4px;
    background: rgba(255,255,255,.22);
    border-radius: 2px;
    overflow: hidden;
  }
  .fs-indicator-bar > i {
    display: block;
    height: 100%;
    background: var(--accent);
    width: 0%;
    transition: width .06s linear;
  }
  .fs-indicator-val {
    font-variant-numeric: tabular-nums;
    font-size: 13px;
    color: #d0d4dc;
  }

  @media (max-width: 720px) {
    .fs-chat { right: 8px; }
    .fs-chat-input-wrap { width: 200px; }
  }

  @media (max-width: 720px) {
    .fs-msg-container { bottom: 80px; max-width: 90%; }
    .fs-msg { font-size: 13px; padding: 8px 12px; }
  }
  @keyframes floatUp { 0% { opacity: 1; transform: translateY(0) scale(0.8); } 20% { transform: translateY(-10px) scale(1.1); } 100% { opacity: 0; transform: translateY(-90px) scale(1); } }

  #side { width: 280px; border-left: 1px solid var(--line); display: flex; flex-direction: column; background: var(--panel); }
  #chat { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
  .msg { max-width: 90%; padding: 6px 10px; border-radius: 10px; background: var(--panel2); font-size: 13px; line-height: 1.35; }
  .msg.me { align-self: flex-end; background: var(--accent2); color: #fff; }
  .msg .who { font-size: 10px; color: var(--dim); margin-bottom: 2px; }
  .msg.me .who { color: rgba(255,255,255,.7); }
  .sys { align-self: center; color: var(--dim); font-size: 11px; }
  #chatbar { display: flex; gap: 6px; padding: 10px; border-top: 1px solid var(--line); }
  #chatbar input { flex: 1; background: var(--panel2); border: 1px solid var(--line); color: var(--text); padding: 8px 10px; border-radius: 8px; }
  #chatbar button { background: var(--accent); border: none; color: #0b0d12; font-weight: 600; padding: 0 14px; border-radius: 8px; cursor: pointer; }

  @media (max-width: 720px) {
    body { height: 100dvh; overflow: hidden; }
    #app { height: 100dvh; }
    #topbar { padding: 8px 10px; gap: 8px; flex-wrap: wrap; }
    #topbar b { font-size: 13px; }
    .pill { font-size: 11px; padding: 3px 8px; }
    #readyBtn { font-size: 11px; padding: 5px 10px; }

    #layout { flex-direction: column; min-height: 0; }
    #main { padding: 8px; gap: 8px; }
    #dropzone { flex: 1; min-height: 0; }
    video { border-radius: 8px; }

    #side {
      width: 100%;
      height: 38vh;
      border-left: none;
      border-top: 1px solid var(--line);
      flex-shrink: 0;
    }
    #chat { padding: 8px; font-size: 12px; }
    .msg { max-width: 85%; font-size: 12px; padding: 5px 8px; }
    #chatbar { padding: 6px; }
    #chatbar input { font-size: 13px; padding: 8px 8px; }
    #chatbar button { padding: 0 10px; font-size: 13px; }

    .bar { gap: 6px; }
    .btn { padding: 7px 10px; font-size: 12px; }

</style>

<script type="module">
import { connect, sendPlay, sendPause, sendSeek, sendChat, sendSyncReq, sendSyncRes, sendReaction, sendPosReq, sendPosRes, setReady, myId, transferHost } from './pulse.js'
import { hashFrame, findOffset } from './fingerprint.js'

const $ = id => document.getElementById(id)
const v = $('v'), chat = $('chat'), toast = $('toast'), dropzone = $('dropzone')

let offset = 0, applying = false, connected = false, fileKey = null
let iAmReady = false, snapped = false
let hostId = null, lastMembers = []
let roomPlaying = false

const remembered = {
  room: localStorage.getItem('pulse.room') || '',
  nick: localStorage.getItem('pulse.nick') || '',
  pass: localStorage.getItem('pulse.pass') || '',
  avatar: localStorage.getItem('pulse.avatar') || '',
}
$('room').value = remembered.room
$('nick').value = remembered.nick
$('pass').value = remembered.pass
$('avatar').value = remembered.avatar

// Accept only http(s) and data:image — blocks javascript:, file:, etc.
function safeAvatarUrl(url) {
  if (!url) return ''
  const s = String(url).trim()
  if (/^https?:\/\//i.test(s)) return s
  if (/^data:image\//i.test(s)) return s
  return ''
}

function savePos() {
  if (!fileKey || !v.duration) return
  localStorage.setItem(fileKey, v.currentTime.toFixed(1))
}
setInterval(savePos, 4000)

function bubble(name, text, mine) {
  chat.insertAdjacentHTML('beforeend',
    `<div class="msg ${mine ? 'me' : ''}"><div class="who">${mine ? 'you' : name}</div>${text}</div>`)
  chat.scrollTop = 1e9
  showFsMessage(mine ? 'you' : name, text)
}

// Fullscreen chat popups ------------------------------------------------------
function fsElement() {
  return document.fullscreenElement || document.webkitFullscreenElement || null
}

function fsContainer() {
  const fs = fsElement()
  if (!fs) return null
  let c = fs.querySelector('.fs-msg-container')
  if (!c) {
    c = document.createElement('div')
    c.className = 'fs-msg-container'
    fs.appendChild(c)
  }
  return c
}

function showFsMessage(name, text) {
  const c = fsContainer()
  if (!c) return   // not fullscreen; nothing to do

  const el = document.createElement('div')
  el.className = 'fs-msg'
  const b = document.createElement('b')
  b.textContent = name || 'you'         // name is raw user input — safe
  const span = document.createElement('span')
  span.innerHTML = text                 // text is already HTML-escaped by caller
  el.appendChild(b)
  el.appendChild(span)
  c.appendChild(el)

  requestAnimationFrame(() => el.classList.add('show'))

  const dismiss = () => {
    el.classList.remove('show')
    el.classList.add('hide')
    setTimeout(() => el.remove(), 250)
  }

  let timer = setTimeout(dismiss, 3000)

  // Swipe / drag to dismiss (any direction, >40px)
  let sx = 0, sy = 0, dragging = false, pid = null
  el.addEventListener('pointerdown', e => {
    dragging = true; pid = e.pointerId; sx = e.clientX; sy = e.clientY
    try { el.setPointerCapture(pid) } catch {}
    clearTimeout(timer)
  })
  el.addEventListener('pointermove', e => {
    if (!dragging) return
    const dx = e.clientX - sx, dy = e.clientY - sy
    el.style.transform = `translate(${dx}px, ${dy}px)`
    el.style.opacity = String(Math.max(0, 1 - Math.hypot(dx, dy) / 120))
  })
  const end = e => {
    if (!dragging) return
    dragging = false
    const dx = e.clientX - sx, dy = e.clientY - sy
    if (Math.hypot(dx, dy) > 40) {
      dismiss()
    } else {
      el.style.transform = ''
      el.style.opacity = ''
      clearTimeout(timer)
      timer = setTimeout(dismiss, 1500)
    }
  }
  el.addEventListener('pointerup', end)
  el.addEventListener('pointercancel', () => {
    dragging = false
    el.style.transform = ''
    el.style.opacity = ''
  })
}

// Clean up when leaving fullscreen
function cleanupFsMessages() {
  if (fsElement()) return
  document.querySelectorAll('.fs-msg').forEach(el => el.remove())
  document.querySelectorAll('.fs-msg-container').forEach(el => el.remove())
  document.querySelectorAll('.fs-chat').forEach(el => el.remove())
  document.querySelectorAll('.fs-react').forEach(el => el.remove())
}
document.addEventListener('fullscreenchange', cleanupFsMessages)
document.addEventListener('webkitfullscreenchange', cleanupFsMessages)

// Fullscreen reactions panel (pull-down handle, top-left) --------------------
function ensureFsReactions(fs) {
  if (fs.querySelector('.fs-react')) return
  const root = document.createElement('div')
  root.className = 'fs-react'
  root.innerHTML = `
    <div class="fs-react-handle" role="button" aria-label="Reactions">
      <div class="fs-react-bar"></div>
    </div>
    <div class="fs-react-row">
      <button data-e="👍">👍</button>
      <button data-e="😂">😂</button>
      <button data-e="😮">😮</button>
      <button data-e="❤️">❤️</button>
      <button data-e="😭">😭</button>
      <button data-e="🔥">🔥</button>
    </div>
  `
  fs.appendChild(root)

  const handle = root.querySelector('.fs-react-handle')
  const row = root.querySelector('.fs-react-row')

  const open = () => root.classList.add('open')
  const close = () => root.classList.remove('open')
  const toggle = () => root.classList.contains('open') ? close() : open()

  let sy = 0, dragging = false
  handle.addEventListener('pointerdown', e => {
    dragging = true; sy = e.clientY
    try { handle.setPointerCapture(e.pointerId) } catch {}
  })
  handle.addEventListener('pointermove', e => {
    if (!dragging) return
    const dy = e.clientY - sy
    if (dy >  20 && !root.classList.contains('open')) { open();  dragging = false }
    if (dy < -20 &&  root.classList.contains('open')) { close(); dragging = false }
  })
  const endDrag = e => {
    if (!dragging) return
    dragging = false
    const dy = e.clientY - sy
    if (dy >  8) open()
    else if (dy < -8) close()
    else toggle()
  }
  handle.addEventListener('pointerup', endDrag)
  handle.addEventListener('pointercancel', () => { dragging = false })

  row.querySelectorAll('button').forEach(btn => {
    btn.onclick = ev => {
      ev.stopPropagation()
      if (!connected) return
      const emoji = btn.dataset.e
      sendReaction(emoji)
      spawnReaction(emoji, 'you')
      close()
    }
  })
}

// Fullscreen chat input (pull-down handle) -----------------------------------
function ensureFsChat() {
  const fs = fsElement()
  if (!fs) return null
  ensureFsReactions(fs)
  let root = fs.querySelector('.fs-chat')
  if (root) return root

  root = document.createElement('div')
  root.className = 'fs-chat'
  root.innerHTML = `
    <div class="fs-chat-handle" role="button" aria-label="Open chat">
      <div class="fs-chat-bar"></div>
    </div>
    <div class="fs-chat-input-wrap">
      <input class="fs-chat-input" type="text" placeholder="Message…" autocomplete="off" enterkeyhint="send" />
      <button class="fs-chat-close" aria-label="Close" type="button">×</button>
    </div>
  `
  fs.appendChild(root)

  const handle   = root.querySelector('.fs-chat-handle')
  const input    = root.querySelector('.fs-chat-input')
  const closeBtn = root.querySelector('.fs-chat-close')

  const open = () => {
    root.classList.add('open')
    // Must fire inside the gesture to open the mobile keyboard.
    setTimeout(() => input.focus(), 60)
  }
  const close = () => {
    root.classList.remove('open')
    input.blur()
  }
  const toggle = () => root.classList.contains('open') ? close() : open()

  let sy = 0, dragging = false
  handle.addEventListener('pointerdown', e => {
    dragging = true
    sy = e.clientY
    try { handle.setPointerCapture(e.pointerId) } catch {}
  })
  handle.addEventListener('pointermove', e => {
    if (!dragging) return
    const dy = e.clientY - sy
    if (dy >  20 && !root.classList.contains('open')) { open();  dragging = false }
    if (dy < -20 &&  root.classList.contains('open')) { close(); dragging = false }
  })
  const endDrag = e => {
    if (!dragging) return
    dragging = false
    const dy = e.clientY - sy
    if (dy >  8) open()
    else if (dy < -8) close()
    else toggle()          // treated as a tap
  }
  handle.addEventListener('pointerup', endDrag)
  handle.addEventListener('pointercancel', () => { dragging = false })

  closeBtn.addEventListener('click', close)

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      e.preventDefault()
      const text = input.value.trim()
      if (!text) return
      sendChat(text)
      bubble('', escapeHtml(text), true)
      input.value = ''
      close()
    } else if (e.key === 'Escape') {
      e.preventDefault()
      close()
    }
  })
  return root
}

// Entering fullscreen → attach the handle. Leaving → cleanup runs above.
document.addEventListener('fullscreenchange', () => { ensureFsChat() })
document.addEventListener('webkitfullscreenchange', () => { ensureFsChat() })

// Global "tap outside to close" — registered once, not per fullscreen session.
document.addEventListener('pointerdown', e => {
  const openChat = document.querySelector('.fs-chat.open')
  if (openChat && !openChat.contains(e.target)) {
    openChat.classList.remove('open')
    const inp = openChat.querySelector('.fs-chat-input')
    if (inp) inp.blur()
  }
  const openReact = document.querySelector('.fs-react.open')
  if (openReact && !openReact.contains(e.target)) {
    openReact.classList.remove('open')
  }
}, true)

// Auto fullscreen on landscape rotation (mobile only) -------------------------
function isMobileDevice() {
  return matchMedia('(hover: none) and (pointer: coarse)').matches
}

function isLandscape() {
  if (screen.orientation && screen.orientation.type) {
    return screen.orientation.type.startsWith('landscape')
  }
  return window.innerWidth > window.innerHeight
}

async function handleOrientationChange() {
  if (!isMobileDevice()) return
  if (!$('app').classList.contains('show')) return
  if (!v.src) return
  if (!dropzone.requestFullscreen) return
  try {
    if (isLandscape() && !document.fullscreenElement) {
      await dropzone.requestFullscreen()
    } else if (!isLandscape() && document.fullscreenElement) {
      await document.exitFullscreen()
    }
  } catch (e) {
    console.debug('[pulse] auto-fullscreen blocked:', e && e.message)
  }
}

if (screen.orientation && screen.orientation.addEventListener) {
  screen.orientation.addEventListener('change', handleOrientationChange)
} else {
  window.addEventListener('orientationchange', () => {
    setTimeout(handleOrientationChange, 200)   // give browser time to update dims
  })
}
function sys(text) {
  chat.insertAdjacentHTML('beforeend', `<div class="sys">${text}</div>`)
  chat.scrollTop = 1e9
}
function say(text, ms = 4000) {
  toast.textContent = text
  clearTimeout(say._t)
  say._t = setTimeout(() => { if (toast.textContent === text) toast.textContent = '' }, ms)
}
function renderMembers(members) {
  if (members) lastMembers = members
  $('members').innerHTML = lastMembers.map(m => {
    const isHost = m.user_id && m.user_id === hostId
    const name = String(m.name || '?')
    const initial = name.slice(0, 2).toUpperCase()
    const safe = escapeHtml(name)
    const tip = `${safe}${m.ready ? ' (ready)' : ''}${isHost ? ' · host' : ''}`
    // Sanitize avatar from other clients too.
    const avatar = safeAvatarUrl(m.avatar || '')
    const img = avatar
      ? `<img src="${escapeHtml(avatar)}" alt="" loading="lazy" onerror="this.remove()">`
      : ''
    return `<div class="avatar ${m.ready ? 'ready' : ''} ${isHost ? 'host' : ''}" title="${tip}">${initial}${img}</div>`
  }).join('')
}

function setHost(id) {
  const prev = hostId
  hostId = id
  const my = myId()
  const mine = !!id && id === my
  const m = lastMembers.find(x => x.user_id === id)
  $('hostText').textContent = mine ? 'you ▾' : (m ? m.name : '—')
  const pill = $('hostPill')
  if (pill) {
    pill.style.cursor = mine ? 'pointer' : 'default'
    pill.title = mine ? 'Click to transfer host' : 'Host'
  }
  // Close any open picker if we're no longer host.
  if (!mine) {
    const picker = $('hostPicker')
    if (picker) picker.classList.add('hidden')
  }
  applyHostLock()
  renderMembers()
  console.log('[pulse] host set:', id, '| me:', my, '| mine:', mine)
  if (connected && id !== prev) {
    if (mine) say('You are host 👑')
    else if (id) say(`${m ? m.name : 'Someone'} is host`)
  }
}

function applyHostLock() {
  const mine = !hostId || hostId === myId()
  dropzone.classList.toggle('locked', !mine)
  $('sync').disabled = !mine
  $('restart').disabled = !mine
  const p = $('pcPlay'), s = $('pcSeek')
  if (p) p.disabled = !mine
  if (s) s.disabled = !mine
}

function openHostPicker() {
  const picker = $('hostPicker')
  const others = lastMembers.filter(m => m.user_id && m.user_id !== myId())
  if (!others.length) { say('No one else in the room'); return }
  picker.innerHTML = others.map(m =>
    `<button class="host-pick" data-id="${m.user_id}">${escapeHtml(m.name)}</button>`
  ).join('')
  picker.classList.remove('hidden')
  picker.querySelectorAll('.host-pick').forEach(btn => {
    btn.onclick = ev => {
      ev.stopPropagation()
      transferHost(btn.dataset.id)
      say(`Host transferred to ${btn.textContent}`)
      picker.classList.add('hidden')
    }
  })
}

$('hostPill').onclick = e => {
  e.stopPropagation()
  if (!connected) return
  if (hostId !== myId()) return
  const picker = $('hostPicker')
  if (picker.classList.contains('hidden')) openHostPicker()
  else picker.classList.add('hidden')
}

document.addEventListener('click', e => {
  const picker = $('hostPicker')
  if (!picker || picker.classList.contains('hidden')) return
  if (picker.contains(e.target)) return
  if (e.target.closest('#hostPill')) return
  picker.classList.add('hidden')
})

function setStatus(state) {
  const pill = $('status')
  pill.className = 'pill ' + state
  $('statusText').textContent = { connected: 'live', reconnecting: 'reconnecting…', lost: 'lost — reload page' }[state] || state
}

function loadFile(f) {
  if (!f) return
  v.src = URL.createObjectURL(f)
  fileKey = `pulse.pos.${f.name}.${f.size}`
  v.onloadedmetadata = () => {
    const saved = parseFloat(localStorage.getItem(fileKey))
    if (saved > 5) { v.currentTime = saved; say(`Resumed at ${fmt(saved)}`) }
    v.onloadedmetadata = null
    if (connected) { snapped = false; sendPosReq() }
    handleOrientationChange()
    reattachSubs()
    syncAssRect()
  }
  $('hint').style.display = 'none'
}
function fmt(s) { return new Date(s * 1000).toISOString().substr(11, 8) }

$('pickFile').onclick = () => $('file').click()
$('file').onchange = e => loadFile(e.target.files[0])
;['dragover', 'drop'].forEach(ev => dropzone.addEventListener(ev, e => e.preventDefault()))
dropzone.addEventListener('drop', e => loadFile(e.dataTransfer.files[0]))

function friendlyConnectError(err) {
  const m = String((err && err.message) || err || '')
  if (/CHANNEL_ERROR|TIMED_OUT|CLOSED|subscribe timeout/i.test(m))
    return 'Could not reach the room server. Check your connection and try again.'
  if (/^auth:/i.test(m))
    return 'Sign-in failed. Try again.'
  return m || 'Could not connect.'
}

$('joinForm').onsubmit = async e => {
  e.preventDefault()
  const btn = $('joinBtn')
  if (btn.disabled) return

  const room = $('room').value.trim(), nick = $('nick').value.trim(), pass = $('pass').value.trim()
  const avatar = safeAvatarUrl($('avatar').value)
  localStorage.setItem('pulse.room', room)
  localStorage.setItem('pulse.nick', nick)
  localStorage.setItem('pulse.pass', pass)
  localStorage.setItem('pulse.avatar', avatar)

  $('splashErr').textContent = ''
  $('splashProg').textContent = ''
  btn.disabled = true
  btn.innerHTML = '<span class="spin"></span>Joining…'

  try {
    await connect(room, nick, pass, {
      onEvent,
      onMembers: renderMembers,
      onHost: setHost,
      onStatus: setStatus,
      onProgress: msg => { $('splashProg').textContent = msg },
    }, avatar)
    connected = true
    $('roomLabel').textContent = room
    document.getElementById('splash').style.display = 'none'
    document.getElementById('app').classList.add('show')
    snapped = false
    applyHostLock()
    sendPosReq()   // late-join snap
  } catch (err) {
    $('splashErr').textContent = friendlyConnectError(err)
    $('splashProg').textContent = ''
    btn.disabled = false
    btn.innerHTML = '<span>Try again</span>'
  }
}

$('readyBtn').onclick = () => {
  iAmReady = !iAmReady
  $('readyBtn').classList.toggle('on', iAmReady)
  $('readyBtn').textContent = iAmReady ? '● Ready' : '○ Not ready'
  setReady(iAmReady)
}

function onEvent(e) {
  if (e.t === 'chat') return bubble(e.name, escapeHtml(e.text), false)

  if (e.t === 'play') {
    const lag = Math.min(2, Math.max(0, (Date.now() - e.sentAt) / 1000))
    const target = e.at + offset + lag
    roomPlaying = true
    applying = true
    if (Math.abs(v.currentTime - target) > 0.3) v.currentTime = target
    v.play().catch(() => {}).finally(() => setTimeout(() => applying = false, 250))
    sys(`${e.name} pressed play`)
  }
  if (e.t === 'pause') {
    roomPlaying = false
    applying = true
    v.pause()
    const target = e.at + offset
    if (Math.abs(v.currentTime - target) > 0.3) v.currentTime = target
    setTimeout(() => applying = false, 250)
    sys(`${e.name} paused`)
  }
  if (e.t === 'seek') {
    const target = e.at + offset
    applying = true
    if (Math.abs(v.currentTime - target) > 0.3) v.currentTime = target
    setTimeout(() => applying = false, 250)
    sys(`${e.name} seeked to ${fmt(target)}`)
  }
  if (e.t === 'sync_req') runSync(e)
  if (e.t === 'sync_res') sys(e.ok ? `${e.name} synced (${e.offset.toFixed(2)}s offset)` : `${e.name} couldn't find a match`)
  if (e.t === 'reaction') spawnReaction(e.emoji, e.name)

  // late-join snap protocol
  if (e.t === 'pos_req') {
    if (v.duration) sendPosRes(e.from, v.currentTime - offset, !v.paused)
  }
  if (e.t === 'pos_res') {
    if (snapped || !v.duration) return
    snapped = true
    roomPlaying = !!e.playing
    const lag = e.playing ? Math.min(2, Math.max(0, (Date.now() - e.sentAt) / 1000)) : 0
    const target = e.at + offset + lag
    v.currentTime = target
    if (e.playing) {
      applying = true
      v.play().catch(() => {}).finally(() => setTimeout(() => applying = false, 250))
    } else {
      applying = true
      v.pause()
      setTimeout(() => applying = false, 250)
    }
    say(`Jumped to ${e.name}'s position`)
  }
}

async function runSync(e) {
  const btn = $('sync')
  btn.classList.add('busy'); btn.textContent = '🔄 Syncing…'
  const r = await findOffset(v, e.hash)
  if (r.ok) { offset = r.localTime - e.at; say(`Synced — offset ${offset.toFixed(2)}s`) }
  else say('No matching scene found nearby')
  btn.classList.remove('busy'); btn.textContent = '🔄 One-time Sync'
  sendSyncRes(e.from, r.ok, offset)
}

function spawnReaction(emoji, name) {
  const el = document.createElement('div')
  el.className = 'reaction-pop'
  el.textContent = emoji
  el.style.left = (20 + Math.random() * 60) + '%'
  el.style.bottom = '10%'
  dropzone.appendChild(el)
  setTimeout(() => el.remove(), 1700)
  sys(`${name} reacted ${emoji}`)
}

document.querySelectorAll('#reactions button').forEach(btn => {
  btn.onclick = () => {
    if (!connected) return
    const emoji = btn.dataset.e
    sendReaction(emoji)
    spawnReaction(emoji, 'you')
  }
})

function enforceRoomState() {
  if (!hostId || hostId === myId()) return
  const attempt = () => {
    applying = true
    if (roomPlaying && v.paused) v.play().catch(() => {})
    else if (!roomPlaying && !v.paused) v.pause()
    setTimeout(() => { applying = false }, 250)
  }
  attempt()
  setTimeout(attempt, 400)   // second chance in case the first was ignored
}

v.addEventListener('play', () => {
  updatePcPlay()
  if (applying) return
  if (hostId && hostId !== myId()) { enforceRoomState(); return }
  if (connected) sendPlay(v.currentTime - offset)
})

// Custom player controls -----------------------------------------------------
function fmtTime(s) {
  if (!isFinite(s) || s < 0) s = 0
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = Math.floor(s % 60)
  return h > 0
    ? `${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`
    : `${m}:${String(sec).padStart(2,'0')}`
}

function updatePcPlay() {
  const b = $('pcPlay'); if (!b) return
  b.textContent = v.paused ? '▶' : '⏸'

}

function updatePcTime() {

}

function updatePcSeek() {
  const s = $('pcSeek'); if (!s || s.matches(':active')) return

  s.value = d ? String(Math.round((v.currentTime / d) * 1000)) : '0'
}

function updatePcMute() {
  const b = $('pcMute'); if (!b) return

// Auto-hide the control bar during playback.
// Uses an interval-based check + timestamp instead of a single setTimeout,
// so continuous mousemove jitter on trackpads can't keep resetting it and
// prevent the controls from ever hiding.
const HIDE_DELAY = 1000
let lastActivity = Date.now()
let overControls = false
let lastMX = null, lastMY = null

function markActivity() {
  lastActivity = Date.now()
  dropzone.classList.remove('pc-hidden')
}

function tickHide() {
  if (v.paused) { dropzone.classList.remove('pc-hidden'); return }
  if (overControls) { lastActivity = Date.now(); return }
  if (Date.now() - lastActivity < HIDE_DELAY) return
  dropzone.classList.add('pc-hidden')
}

setInterval(tickHide, 300)

dropzone.addEventListener('mousemove', e => {
  // Ignore sub-3px jitter (trackpad noise) so the timer isn't defeated.
  if (lastMX === null ||
      Math.abs(e.clientX - lastMX) > 3 ||
      Math.abs(e.clientY - lastMY) > 3) {
    lastMX = e.clientX
    lastMY = e.clientY
    markActivity()
  }
})
dropzone.addEventListener('touchstart', markActivity, { passive: true })
dropzone.addEventListener('pointerdown', markActivity)

$('playerControls').addEventListener('mouseenter', () => { overControls = true; markActivity() })
$('playerControls').addEventListener('mouseleave', () => { overControls = false; markActivity() })

v.addEventListener('play', markActivity)
v.addEventListener('pause', () => { dropzone.classList.remove('pc-hidden') })
v.addEventListener('ended', () => { dropzone.classList.remove('pc-hidden') })

window.addEventListener('keydown', markActivity)

// Keyboard: space = play/pause, F = fullscreen (host only)
window.addEventListener('keydown', e => {
  if (e.target && ['INPUT','TEXTAREA','SELECT','BUTTON'].includes(e.target.tagName)) return
  if (e.key === ' ' && !e.repeat) {
    e.preventDefault()
    $('pcPlay').click()
  } else if (e.key === 'f' || e.key === 'F') {
    e.preventDefault()
    $('pcFs').click()
  }
})

// MX-Player style fullscreen gestures ----------------------------------------
// Left half: swipe up = brighter, down = dimmer (CSS filter on the video).
// Right half: swipe up = louder, down = quieter.
// Only active in fullscreen; ignored when the drag starts on any UI control.
const clamp01 = (x, lo, hi) => Math.max(lo, Math.min(hi, x))

let currentBrightness = 1
function applyBrightness(val) {
  currentBrightness = val
  v.style.filter = val >= 0.99 ? '' : `brightness(${val.toFixed(3)})`
}

const fsIndicator = document.createElement('div')
fsIndicator.className = 'fs-indicator'
fsIndicator.innerHTML = `
  <div class="fs-indicator-icon"></div>
  <div class="fs-indicator-bar"><i></i></div>
  <div class="fs-indicator-val"></div>
`
dropzone.appendChild(fsIndicator)

let indicatorTimer = null
function showIndicator(icon, value01, label) {
  fsIndicator.querySelector('.fs-indicator-icon').textContent = icon
  fsIndicator.querySelector('.fs-indicator-bar > i').style.width =
    Math.round(value01 * 100) + '%'
  fsIndicator.querySelector('.fs-indicator-val').textContent = label
  fsIndicator.classList.add('show')
  clearTimeout(indicatorTimer)
}
function hideIndicatorSoon() {
  clearTimeout(indicatorTimer)
  indicatorTimer = setTimeout(() => fsIndicator.classList.remove('show'), 700)
}

let gesture = null

function gestureAllowed(target) {
  if (!document.fullscreenElement) return false
  if (!target || typeof target.closest !== 'function') return true
  return !target.closest(
    '#playerControls, .fs-chat, .fs-react, .fs-msg, .fs-indicator'
  )
}

dropzone.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse' && e.button !== 0) return
  if (!gestureAllowed(e.target)) return
  const rect = dropzone.getBoundingClientRect()
  if (!rect.width || !rect.height) return
  const isLeft = (e.clientX - rect.left) < rect.width / 2
  gesture = {
    kind: isLeft ? 'bright' : 'vol',
    startY: e.clientY,
    startBright: currentBrightness,
    startVol: v.muted ? 0 : v.volume,
    rectH: rect.height,
    pointerId: e.pointerId,
    moved: false,
  }
  try { dropzone.setPointerCapture(e.pointerId) } catch {}
})

dropzone.addEventListener('pointermove', e => {
  if (!gesture || e.pointerId !== gesture.pointerId) return
  const dy = gesture.startY - e.clientY      // positive = swipe up
  if (!gesture.moved && Math.abs(dy) < 8) return
  gesture.moved = true

  // Full-height swipe moves the full range.
  const delta = dy / (gesture.rectH * 0.7)

  if (gesture.kind === 'bright') {
    const next = clamp01(gesture.startBright + delta, 0.1, 1.0)
    applyBrightness(next)
    const pct = (next - 0.1) / 0.9
    showIndicator('☀️', pct, Math.round(pct * 100) + '%')
  } else {
    const next = clamp01(gesture.startVol + delta, 0, 1)
    v.volume = next
    v.muted = next === 0
    updatePcMute()
    const vol = $('pcVol'); if (vol) vol.value = String(next)
    showIndicator(next === 0 ? '🔇' : '🔊', next, Math.round(next * 100) + '%')
  }
})

function endGesture(e) {
  if (!gesture) return
  if (e.pointerId !== undefined && e.pointerId !== gesture.pointerId) return
  const moved = gesture.moved
  gesture = null
  if (moved) hideIndicatorSoon()
}
dropzone.addEventListener('pointerup', endGesture)
dropzone.addEventListener('pointercancel', endGesture)

// Stop the browser from turning a vertical swipe into a page scroll / pull-to-refresh.
dropzone.addEventListener('touchmove', e => {
  if (gesture && gesture.moved) e.preventDefault()
}, { passive: false })

updatePcPlay(); updatePcMute(); updatePcTime()

$('restart').onclick = () => {

// ── Subtitles ────────────────────────────────────────────────────────────────
const SUB_KEY = 'pulse.substyle'
const DEFAULT_SUB_STYLE = { scale: 100, color: '#ffffff', bg: 60, font: 'system', pos: 88, shadow: true }
let subSettings = Object.assign({}, DEFAULT_SUB_STYLE, JSON.parse(localStorage.getItem(SUB_KEY) || '{}'))

let subCues = null        // [{start, end, text}] for SRT / VTT
let subTrack = null       // native <track> element
let subObjectUrl = null   // blob URL backing the track
let subAss = null         // ASS.js instance
let subAssText = null     // raw ASS source, kept so we can rebuild on video change
let subsLoaded = false
let subsVisible = false

const FONT_MAP = {
  system: '-apple-system, "Segoe UI", Roboto, sans-serif',
  sans: 'Arial, Helvetica, sans-serif',
  serif: 'Georgia, "Times New Roman", serif',
  mono: 'ui-monospace, Menlo, Consolas, monospace',
}

const cueStyleEl = document.createElement('style')
cueStyleEl.id = 'cueStyle'
document.head.appendChild(cueStyleEl)

const pad = (n, w = 2) => String(n).padStart(w, '0')
function fmtVttTime(total) {
  const ms = Math.round(total * 1000)
  return `${pad(Math.floor(ms / 3600000))}:${pad(Math.floor(ms / 60000) % 60)}:${pad(Math.floor(ms / 1000) % 60)}.${pad(ms % 1000, 3)}`
}
function toSeconds(h, m, s, mmm) {
  return (+h) * 3600 + (+m) * 60 + (+s) + (+mmm.padEnd(3, '0')) / 1000
}

// Escape everything, then re-allow the inline tags WebVTT actually supports.
function sanitizeSubText(s) {
  let t = String(s)
    .replace(/\{\\[^}]*\}/g, '')            // ASS override codes that leak into SRT
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
  t = t.replace(/&lt;(\/?)(b|i|u)&gt;/gi, '<$1$2>')
  t = t.replace(/&lt;br\s*\/?&gt;/gi, '\n')
  return t
}

const TIME_RE = /(\d{1,2}):(\d{2}):(\d{2})[.,](\d{1,3})\s*-->\s*(\d{1,2}):(\d{2}):(\d{2})[.,](\d{1,3})/

function parseSrt(text) {
  const out = []
  const clean = String(text).replace(/\r\n?/g, '\n').replace(/^\uFEFF/, '')
  for (const block of clean.split(/\n{2,}/)) {
    const lines = block.split('\n')
    let i = 0
    while (i < lines.length && !lines[i].trim()) i++
    if (i >= lines.length) continue
    if (/^\d+$/.test(lines[i].trim())) i++
    if (i >= lines.length) continue
    const m = lines[i].match(TIME_RE)
    if (!m) continue
    const body = lines.slice(i + 1).join('\n').trim()
    if (body) out.push({ start: toSeconds(m[1], m[2], m[3], m[4]), end: toSeconds(m[5], m[6], m[7], m[8]), text: sanitizeSubText(body) })
  }
  return out
}

function parseVtt(text) {
  const out = []
  const clean = String(text).replace(/\r\n?/g, '\n').replace(/^\uFEFF/, '')
  for (const block of clean.split(/\n{2,}/)) {
    const lines = block.split('\n').filter(l => l.trim())
    if (!lines.length) continue
    if (/^WEBVTT/.test(lines[0])) { lines.shift(); if (!lines.length) continue }
    if (/^(STYLE|NOTE|REGION)\b/.test(lines[0])) continue
    let i = 0
    if (!lines[i].includes('-->')) i++
    if (i >= lines.length) continue
    const m = lines[i].match(TIME_RE)
    if (!m) continue
    const body = lines.slice(i + 1).join('\n').trim()
    if (body) out.push({ start: toSeconds(m[1], m[2], m[3], m[4]), end: toSeconds(m[5], m[6], m[7], m[8]), text: body })
  }
  return out
}

function buildVtt(cues, posPercent) {
  const body = cues.map(c =>
    `${fmtVttTime(c.start)} --> ${fmtVttTime(c.end)} line:${posPercent}% position:50% align:center\n${c.text}\n`
  ).join('\n')
  return 'WEBVTT\n\n' + body
}

function applyCueStyle() {
  const s = subSettings
  cueStyleEl.textContent = `
    video::cue {
      font-size: ${s.scale}%;
      color: ${s.color};
      background-color: rgba(0,0,0,${(s.bg / 100).toFixed(2)});
      font-family: ${FONT_MAP[s.font] || FONT_MAP.system};
      ${s.shadow ? 'text-shadow: 0 0 4px #000, 0 0 2px #000, 0 1px 3px #000;' : ''}
      line-height: 1.35;
    }
  `
}

function saveSubSettings() {
  try { localStorage.setItem(SUB_KEY, JSON.stringify(subSettings)) } catch {}
}

function ensureTrack() {
  if (!subTrack) {
    subTrack = document.createElement('track')
    subTrack.kind = 'subtitles'
    subTrack.srclang = 'en'
    subTrack.label = 'Subtitles'
    subTrack.default = true
  }
  if (subTrack.parentNode !== v) v.appendChild(subTrack)
  return subTrack
}

function rebuildVttTrack() {
  if (!subCues) return
  if (subObjectUrl) URL.revokeObjectURL(subObjectUrl)
  subObjectUrl = URL.createObjectURL(new Blob([buildVtt(subCues, subSettings.pos)], { type: 'text/vtt' }))
  ensureTrack().src = subObjectUrl
}

function setSubsVisible(on) {
  subsVisible = !!on && subsLoaded
  const box = $('subVisible'); if (box) box.checked = subsVisible
  const btn = $('subToggleBtn')
  if (btn) { btn.classList.toggle('on', subsVisible); btn.setAttribute('aria-pressed', subsVisible ? 'true' : 'false') }
  if (subTrack) subTrack.mode = subsVisible ? 'showing' : 'hidden'
  const container = $('assContainer')
  if (container) container.style.display = subsVisible ? '' : 'none'
  if (subAss) { try { subsVisible ? subAss.show() : subAss.hide() } catch {} }
}

function removeSubs() {
  if (subObjectUrl) { URL.revokeObjectURL(subObjectUrl); subObjectUrl = null }
  if (subTrack) { try { subTrack.remove() } catch {} subTrack = null }
  if (subAss) { try { subAss.destroy() } catch {} subAss = null }
  subAssText = null; subCues = null; subsLoaded = false
  const c = $('assContainer'); if (c) c.innerHTML = ''
  setSubsVisible(false)
  updateSubNote()
  say('Subtitles removed')
}

function looksLikeAss(text) {
  return /^\s*\[Script Info\]/im.test(text) || /^\s*\[V4\+? Styles\]/im.test(text)
}

function updateSubNote() {
  const note = $('subNote')
  if (!note) return
  if (subAssText) {
    note.textContent = 'ASS / SSA file loaded — its own styling is used. The style controls below apply to .srt / .vtt only.'
    note.classList.remove('hidden')
  } else {
    note.classList.add('hidden')
  }
}

// ASS.js is fetched on demand so users who never load an .ass file don't pay for it.
let assLibPromise = null
function loadAssLib() {
  if (window.ASS) return Promise.resolve(window.ASS)
  if (assLibPromise) return assLibPromise
  assLibPromise = new Promise((resolve, reject) => {
    const s = document.createElement('script')
    s.src = 'https://cdn.jsdelivr.net/npm/assjs@0.1.6/dist/ass.global.min.js'
    s.onload = () => window.ASS ? resolve(window.ASS) : reject(new Error('ASS global missing'))
    s.onerror = () => reject(new Error('ASS lib failed to load'))
    document.head.appendChild(s)
  })
  return assLibPromise
}

function syncAssRect() {
  const box = $('assContainer')
  if (!box || !subAss) return
  if (!v.offsetWidth || !v.offsetHeight) return
  box.style.left = v.offsetLeft + 'px'
  box.style.top = v.offsetTop + 'px'
  box.style.width = v.offsetWidth + 'px'
  box.style.height = v.offsetHeight + 'px'
  box.style.transform = 'none'
}

async function loadAss(text) {
  try { await loadAssLib() } catch { say('ASS renderer failed to load'); return }
  if (subAss) { try { subAss.destroy() } catch {} subAss = null }
  if (subObjectUrl) { URL.revokeObjectURL(subObjectUrl); subObjectUrl = null }
  if (subTrack) { try { subTrack.remove() } catch {} subTrack = null }
  subCues = null
  const container = $('assContainer')
  container.innerHTML = ''
  subAssText = text
  subAss = new window.ASS(text, v, { container, resampling: 'video_width' })
  subsLoaded = true
  syncAssRect()
  setSubsVisible(true)
  updateSubNote()
  say('ASS subtitles loaded')
}

async function handleSubFile(file) {
  if (!file) return
  const name = (file.name || '').toLowerCase()
  let text = ''
  try { text = await file.text() } catch { say('Could not read subtitle file'); return }
  if (name.endsWith('.ass') || name.endsWith('.ssa') || looksLikeAss(text)) { await loadAss(text); return }

  const isVtt = name.endsWith('.vtt') || /^\uFEFF?WEBVTT/.test(text)
  const cues = isVtt ? parseVtt(text) : parseSrt(text)
  if (!cues.length) { say('No subtitle cues found in that file'); return }

  if (subAss) { try { subAss.destroy() } catch {} subAss = null }
  $('assContainer').innerHTML = ''
  subAssText = null
  subCues = cues
  rebuildVttTrack()
  subsLoaded = true
  setSubsVisible(true)
  updateSubNote()
  say(`${cues.length} subtitle cues loaded`)
}

function reattachSubs() {
  if (subCues) {
    rebuildVttTrack()
    if (subTrack) subTrack.mode = subsVisible ? 'showing' : 'hidden'
  }
  if (subAssText && window.ASS) {
    if (subAss) { try { subAss.destroy() } catch {} }
    subAss = new window.ASS(subAssText, v, { container: $('assContainer'), resampling: 'video_width' })
    if (!subsVisible) { try { subAss.hide() } catch {} }
    syncAssRect()
  }
}

function syncSubPanelUI() {

  $('subScale').value = s.scale; $('subScaleVal').textContent = s.scale + '%'
  $('subColor').value = s.color

}

$('subColor').oninput = e => { subSettings.color = e.target.value; applyCueStyle(); saveSubSettings() }
$('subBg').oninput = e => { subSettings.bg = +e.target.value; $('subBgVal').textContent = subSettings.bg + '%'; applyCueStyle(); saveSubSettings() }

document.addEventListener('click', e => {
  const panel = $('subPanel')
  if (!panel || panel.classList.contains('hidden')) return
  if (panel.contains(e.target)) return
  if (e.target.closest && e.target.closest('#subStyleBtn')) return
  panel.classList.add('hidden')
})

window.addEventListener('resize', syncAssRect)
document.addEventListener('fullscreenchange', () => setTimeout(syncAssRect, 60))
if (window.ResizeObserver) new ResizeObserver(syncAssRect).observe($('videoWrap'))

applyCueStyle()
syncSubPanelUI()

function post() {
  const box = $('msg'), text = box.value.trim()
  if (!connected || !text) return
  sendChat(text); bubble('', escapeHtml(text), true); box.value = ''
}
$('send').onclick = post
$('msg').onkeydown = e => { if (e.key === 'Enter') post() }
function escapeHtml(s) { return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])) }
