<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WebRTC Star - Host</title>
  <link rel="stylesheet" href="../../styles.css">
</head>
<body>
  <h2>Host (star hub)</h2>
  <div>
    <label for="sig">Signaling server:</label>
    <input id="sig" type="url" value="ws://localhost:3000" title="Signaling server websocket URL">
    <button id="connect" type="button">Connect</button>
  </div>

  <div id="clients">
    <h3>Connected peers</h3>
    <ul id="peerList"></ul>
  </div>

  <div class="log">
    <textarea id="log" readonly title="Connection log" placeholder="Connection and messaging log"></textarea>
  </div>

  <div class="controls">
    <label for="msg" class="visually-hidden">Message to broadcast</label>
    <input id="msg" placeholder="Message to broadcast" title="Message to broadcast to all peers" class="small-input">
    <button id="send" type="button">Broadcast</button>
  </div>

  <div class="video-section" style="margin-top: 20px;">
    <h3>Video Player (Host Controls)</h3>
    <video id="video" controls style="width: 100%; max-width: 800px; border-radius: 8px; background: #000;">
      <source src="" type="video/mp4">
      Your browser does not support the video tag.
    </video>
    <div style="margin-top: 8px;">
      <label for="videoUrl">Video URL:</label>
      <input id="videoUrl" type="url" placeholder="Enter video URL" style="width: 60%; margin-left: 8px;" class="small-input">
      <button id="loadVideo" type="button" style="margin-left: 8px;">Load Video</button>
    </div>
    <p style="margin-top: 8px; color: var(--muted); font-size: 0.9rem;">
      Host controls: Play, pause, and seeking will sync to all clients
    </p>
  </div>

  <script src="host.js"></script>
</body>
</html>
